# Railway template for the NestJS company-discovery API service.
# In Railway, create a second service from this monorepo and copy these settings.
#
# Optional caching: add a Redis service to the project and set this service's
# REDIS_URL variable to its private URL (e.g. ${{Redis.REDIS_URL}}). Repeat
# searches are then served from cache for 24h. Leave REDIS_URL unset to disable
# caching entirely — search works either way.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @mural/company-discovery build && pnpm --filter server build"

[deploy]
startCommand = "pnpm --filter server start:prod"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# In-memory search rate limiter assumes a single instance. Keep at 1 replica
# unless the limiter is moved to a shared store.
numReplicas = 1
